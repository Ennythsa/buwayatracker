<body>
<header class="bar"><div class="brand"><div class="logo">BT</div><div><b>Buwaya Tracker</b><div class="mute">A community-run tracker of Philippine politicians</div></div></div>
<div id="top"><button data-show="home">Home</button><button data-show="dir">Directory</button><button data-show="tracker">Dynasty graph</button><button data-show="cmp">Compare</button><button data-show="news">News search</button><button data-show="data">Data</button><button id="adm">Admin sign in</button></div></header>
<div class="ban"><b>Pinakakurakot sa T1</b><a class="byel" id="contrib" target="_blank" rel="noopener noreferrer">Contribute →</a></div>
<section id="v-home"></section><section id="v-dir" hidden></section>
<main id="v-tracker" hidden><section id="stage"><canvas id="cv"></canvas><div id="legend"></div></section><aside><div id="tabs"></div><div id="pane"></div></aside></main>
<section id="v-cmp" hidden></section><section id="v-news" hidden></section><section id="v-data" hidden></section>
<div id="modal" hidden><div class="mb"><button class="x" id="mx" aria-label="Close">×</button><div id="mc"></div></div></div>
<script>
const REPO0='ariehaku/bububububub',BRANCH='main',CSE_ID='';   /* CSE_ID: optional Google Programmable Search Engine ID */
const _h=location.hostname,_p=location.pathname.split('/')[1];
const REPO=_h.endsWith('.github.io')&&_p?_h.split('.')[0]+'/'+_p:REPO0;   /* detected from the site address */
let DIR='data/',EDIT_URL='';
const $=s=>document.querySelector(s);
const txt=async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+f+' ('+r.status+')');return r.text()};
const get=async f=>{try{return await txt(DIR+f)}catch(e){if(DIR){DIR='';return await txt(f)}throw e}};   /* data/ folder, or repo root */
const rows=t=>t.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&l[0]!=='#').map(l=>l.split('|').map(x=>x.trim()));
const sn=n=>{const w=n.split(/\s+/);let i=w.length-1;while(i>0&&/^(de|del|dela|delos|san|santa|van|von)$/i.test(w[i-1]))i--;return w.slice(i).join(' ')};
async function main(){
const TB={pol:{f:'politicians.txt',n:'Politicians',cols:['ID','Name','Party','Position','Platform','Track record'],w:[60,160,130,140,260,300],lim:[0,100,50,50,300,300],size:6},
rel:{f:'relations.txt',n:'Relations',cols:['Person A (ID)','Person B (ID)','Type'],w:[110,110,120],size:3},
prof:{f:'profiles.txt',n:'Profiles',cols:['Politician ID','Photo (link or photos/…)','Level','Group','Area / district'],w:[100,260,130,160,200],size:5},
news:{f:'news.txt',n:'News',cols:['Date (YYYY-MM-DD)','Category','Title','Summary','Link (optional)','Politician ID (optional)'],w:[120,110,220,300,200,110],size:6},
src:{f:'sources.txt',n:'Sources',cols:['Politician ID','No.','Source title','URL'],w:[100,60,280,320],size:4}};
const RAW={},HEAD={},SHA={};
const lead=t=>{const o=[];for(const l of t.split(/\r?\n/)){const x=l.trim();if(x[0]==='#')o.push(x);else if(x)break}return o.join('\n')};
const norm=(k,c)=>{const n=TB[k].size;c=c.slice(0,n-1).concat([c.slice(n-1).join('|')]);while(c.length<n)c.push('');return c};
const parse=(k,t)=>{HEAD[k]=lead(t);RAW[k]=rows(t).map(c=>norm(k,c))};
const T={pol:await get('politicians.txt')};
for(const k of ['rel','news','src','prof'])T[k]=await get(TB[k].f).catch(()=>'');
for(const k in T)parse(k,T[k]);
EDIT_URL='https://github.com/'+REPO+'/edit/'+BRANCH+'/'+DIR;$('#contrib').href='https://github.com/'+REPO;

  
/* ---------- admin session (GitHub token) ---------- */
let tok=sessionStorage.getItem('bt-tok')||'',admin=false,idle=0,msg='';
const api=(path,o={})=>fetch('https://api.github.com/'+path,{...o,headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+tok,...(o.headers||{})}});
const b64=s=>{let b='';new TextEncoder().encode(s).forEach(c=>{b+=String.fromCharCode(c)});return btoa(b)};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function signOut(){tok='';admin=false;sessionStorage.removeItem('bt-tok');location.reload()}
const bump=()=>{clearTimeout(idle);if(admin)idle=setTimeout(signOut,900000)};
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,bump));
async function signIn(t){tok=t.trim();const r=await api('repos/'+REPO);
if(!r.ok)throw new Error(r.status===401?'That token was rejected.':'Could not open the repository ('+r.status+'). Check the token’s repository access.');
const j=await r.json();if(j.permissions&&!j.permissions.push)throw new Error('This token has no write access to '+REPO+'.');
for(const k in TB){const f=await api(`repos/${REPO}/contents/${DIR}${TB[k].f}?ref=${BRANCH}`);
if(f.ok){const d=await f.json();SHA[k]=d.sha;parse(k,unb64(d.content))}else if(f.status===404){SHA[k]=undefined}else throw new Error('Could not load '+TB[k].f+' ('+f.status+')')}
admin=true;sessionStorage.setItem('bt-tok',tok);bump()}
if(tok){try{await signIn(tok)}catch(e){tok='';admin=false;sessionStorage.removeItem('bt-tok')}}   /* admins always see the freshest data */
$('#adm').textContent=admin?'Sign out (admin)':'Admin sign in';
const P=RAW.pol.filter(c=>/^\d+$/.test(c[0])&&c[1]).map(c=>({id:+c[0],name:c[1],party:c[2],pos:c[3],plat:c[4],rec:c[5],s:sn(c[1])}));
const ids=new Set(P.map(p=>p.id));
const R=RAW.rel.filter(c=>ids.has(+c[0])&&ids.has(+c[1])&&['spouse','parent','sibling','cousin'].includes(c[2])).map(c=>[+c[0],+c[1],c[2]]);
const NEWS=RAW.news.filter(c=>c[0]&&c[2]).map(c=>({date:c[0],cat:c[1],title:c[2],sum:c[3],link:c[4],pid:c[5]})).sort((a,b)=>b.date.localeCompare(a.date));
const SRC=new Map();RAW.src.forEach(c=>{if(/^\d+$/.test(c[0])&&/^\d+$/.test(c[1])){const m=SRC.get(+c[0])||{};m[+c[1]]={t:c[2],u:c[3]};SRC.set(+c[0],m)}});
const PF=new Map(RAW.prof.filter(c=>/^\d+$/.test(c[0])).map(c=>[+c[0],{photo:c[1],level:c[2],group:c[3],area:c[4]}]));
const PAL=['#7F77DD','#1D9E75','#D85A30','#378ADD','#BA7517','#D4537E','#639922','#E24B4A','#0F6E56','#993556'],COL={};[...new Set(P.map(p=>p.party))].forEach((k,i)=>{COL[k]=PAL[i%PAL.length]});
const STY={parent:{d:[],w:2.4},spouse:{d:[],w:1.4},sibling:{d:[7,4],w:1.4},cousin:{d:[2,4],w:1.6}};
const byId=new Map(P.map(p=>[p.id,p]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const adj=new Map(P.map(p=>[p.id,[]]));
R.forEach(([a,b,t])=>{adj.get(a).push({to:b,t,a,b});adj.get(b).push({to:a,t,a,b})});
const relLabel=(e,from)=>e.t==='parent'?(e.a===from?'Parent of':'Child of'):e.t[0].toUpperCase()+e.t.slice(1)+' of';
/* dynasties = connected family groups */
const comp=new Map(),dyn=[];
P.forEach(p=>{if(comp.has(p.id))return;const q=[p.id],m=[];comp.set(p.id,dyn.length);
while(q.length){const x=q.pop();m.push(x);adj.get(x).forEach(e=>{if(!comp.has(e.to)){comp.set(e.to,dyn.length);q.push(e.to)}})}
m.sort((a,b)=>a-b);dyn.push({m,name:m.length>1?'House of '+byId.get(m[0]).s:'Independent: '+byId.get(m[0]).name})});
function path(a,b){const prev=new Map([[a,null]]),q=[a];
while(q.length){const x=q.shift();if(x===b)break;adj.get(x).forEach(e=>{if(!prev.has(e.to)){prev.set(e.to,{from:x,e});q.push(e.to)}})}
if(!prev.has(b))return null;const out=[];let c=b;while(c!==a){const s=prev.get(c);out.unshift(s);c=s.from}return out}
/* ---------- state ---------- */
let tab='dyn',sel=null,hover=null,hl=null,q='',cA=P[0]?.id,cB=P[Math.min(4,P.length-1)]?.id;
const pane=$('#pane');
/* ---------- graph ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let W=300,H=300,dpr=1,view={x:0,y:0,k:1,set:0},alpha=1;
const N=P.map((p,i)=>{const a=i/P.length*6.283;return{id:p.id,x:Math.cos(a)*160,y:Math.sin(a)*160,vx:0,vy:0,r:9+adj.get(p.id).length*3,fx:false}});
const nm=new Map(N.map(n=>[n.id,n]));
function fit(){const r=stage.getBoundingClientRect();dpr=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;if(!view.set&&W>10){view.x=W/2;view.y=H/2;view.set=1}}
new ResizeObserver(fit).observe(stage);fit();
function step(){const a=alpha;
for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const A=N[i],B=N[j];let dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=3200/d2*a;dx/=d;dy/=d;A.vx-=dx*f;A.vy-=dy*f;B.vx+=dx*f;B.vy+=dy*f}
R.forEach(([x,y])=>{const A=nm.get(x),B=nm.get(y);let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,f=(d-105)*.05*a;dx/=d;dy/=d;A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f});
N.forEach(n=>{n.vx-=n.x*.01*a;n.vy-=n.y*.01*a;if(!n.fx){n.x+=n.vx;n.y+=n.vy}n.vx*=.8;n.vy*=.8});alpha*=.985}
function focusSet(){if(hl)return hl;const id=hover??sel;if(id==null)return null;const s=new Set([id]);adj.get(id).forEach(e=>s.add(e.to));return s}
function matchSet(){if(!q)return null;const k=q.toLowerCase();return new Set(P.filter(p=>p.name.toLowerCase().includes(k)||p.plat.toLowerCase().includes(k)).map(p=>p.id))}
function draw(){const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=g('--bg');ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
const F=focusSet(),M=matchSet(),fid=hover??sel;
dyn.forEach(d=>{if(d.m.length<2)return;let cx=0,cy=0;d.m.forEach(i=>{cx+=nm.get(i).x;cy+=nm.get(i).y});cx/=d.m.length;cy/=d.m.length;
let r=0;d.m.forEach(i=>{r=Math.max(r,Math.hypot(nm.get(i).x-cx,nm.get(i).y-cy))});r+=48;

$('#legend').innerHTML='<div>'+dyn.map((d,i)=>[d,i]).filter(x=>x[0].m.length>1).map(([d,i])=>`<span><i style="background:${PAL[i%PAL.length]}"></i>${esc(d.name)}</span>`).join('')+'</div><div style="margin-top:4px;color:var(--mute)">'+Object.keys(STY).map(k=>`<span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="currentColor" stroke-width="${STY[k].w}" stroke-dasharray="${STY[k].d.join(' ')}"/></svg>${k}</span>`).join('')+'</div>';
go('dyn');
/* ---------- data tables (admin editing) ---------- */
let dk='pol';
const clean=k=>RAW[k].map(r=>r.map(v=>String(v).replace(/[|\r\n]+/g,' ').trim()));
function validate(k,rs){const e=[],L=TB[k].lim||[],ok=u=>/^https?:\/\//.test(u),pid=new Set((k==='pol'?rs:clean('pol')).map(r=>r[0]));
rs.forEach((r,i)=>{const w='Row '+(i+1)+': ';
if(k==='pol'){if(!/^\d+$/.test(r[0]))e.push(w+'ID must be a number.');if(rs.filter(x=>x[0]===r[0]).length>1)e.push(w+'ID '+r[0]+' is used more than once.');if(!r[1])e.push(w+'name is required.');r.forEach((v,c)=>{if(L[c]&&v.length>L[c])e.push(w+TB.pol.cols[c]+' is over '+L[c]+' characters.')})}
if(k==='rel'){if(!pid.has(r[0])||!pid.has(r[1]))e.push(w+'both IDs must exist in Politicians.');if(!['spouse','parent','sibling','cousin'].includes(r[2]))e.push(w+'type must be spouse, parent, sibling or cousin.')}
if(k==='prof'){if(!pid.has(r[0]))e.push(w+'politician ID not found.');if(r[1]&&!/^(https?:\/\/|photos\/)/.test(r[1]))e.push(w+'photo must be a link or start with photos/.');if(r[2]&&!LV.includes(r[2]))e.push(w+'level must be one of: '+LV.join(', ')+'.')}
if(k==='news'){if(!/^\d{4}-\d{2}-\d{2}$/.test(r[0]))e.push(w+'date must be YYYY-MM-DD.');if(!r[1]||!r[2]||!r[3])e.push(w+'category, title and summary are required.');if(r[4]&&!ok(r[4]))e.push(w+'link must start with http:// or https://.');if(r[5]&&!pid.has(r[5]))e.push(w+'politician ID not found.')}
if(k==='src'){if(!pid.has(r[0]))e.push(w+'politician ID not found.');if(!/^\d+$/.test(r[1]))e.push(w+'No. must be a number.');if(!r[2])e.push(w+'title is required.');if(!ok(r[3]))e.push(w+'URL must start with http:// or https://.')}});
return e}
async function commit(k){const rs=clean(k),er=validate(k,rs);if(er.length)return er.slice(0,6).join(' · ');RAW[k]=rs;
if(k==='prof'&&!HEAD.prof)HEAD.prof='# Extra profile info. Format: id|photo (link or photos/file.jpg)|level|group|area\n# Leave level and group blank to detect them from the position.';
const text=(HEAD[k]?HEAD[k]+'\n':'')+rs.map(r=>r.join('|')).join('\n')+'\n';
const r=await api(`repos/${REPO}/contents/${DIR}${TB[k].f}`,{method:'PUT',body:JSON.stringify({message:'Update '+TB[k].f+' from the admin page',content:b64(text),sha:SHA[k],branch:BRANCH})});
if(r.ok){SHA[k]=(await r.json()).content.sha;return''}
return(r.status===409||r.status===422)?'GitHub has a newer version of '+TB[k].f+'. Sign out, sign in again and retry.':'Save failed ('+r.status+').'}
function fmtCell(r,c,v){if(dk==='pol'&&c===5)return fmtRec(+RAW.pol[r][0],v);
if(dk==='rel'&&c<2)return esc(v)+' <span class="mute">'+esc(nameOf(v))+'</span>';
if(/^https?:\/\//.test(v)&&((dk==='news'&&c===4)||(dk==='src'&&c===3)))return`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(dk==='src'?v:'link')}</a>`;return esc(v)}
function rData(){const t=TB[dk],rs=RAW[dk];
const bar=admin?`<div class="card">Signed in as admin. Edit the cells, then press <b>Save to GitHub</b>. Nothing is saved until you do. You are signed out after 15 idle minutes. Tip: use <b>+ Add profile</b> on the Directory page for a friendlier form.</div>`
:`<div class="card"><b>Admin sign in</b><div class="mute" style="margin:4px 0 8px">Only people with write access to the GitHub repository <code>${esc(REPO)}</code> can edit. Paste a fine-grained access token with “Contents: Read and write” for this repository. It stays in this browser tab only. Public sign-up isn’t available because this site has no server.</div><input id="tk" type="password" autocomplete="off" placeholder="GitHub token (github_pat_…)"> <button class="btn" id="si">Sign in</button></div>`;
const cell=(r,c,v)=>admin?`<input data-r="${r}" data-c="${c}" value="${esc(v)}" style="min-width:${t.w[c]}px">`:fmtCell(r,c,v);
$('#v-data').innerHTML=`<div class="wrap"><h1>Data tables</h1><p class="mute">The same information as the text files in the <code>${esc(DIR||'repository root')}</code>, shown as tables.</p><div class="chips">${Object.keys(TB).map(k=>`<button data-dk="${k}" class="${k===dk?'on':''}">${TB[k].n}</button>`).join('')}</div>${msg?`<div class="card">${msg}</div>`:''}${bar}
<div class="tw"><table class="dt"><thead><tr>${t.cols.map(c=>`<th>${esc(c)}</th>`).join('')}${admin?'<th></th>':''}</tr></thead><tbody>${rs.map((r,i)=>`<tr>${r.map((v,c)=>`<td>${cell(i,c,v)}</td>`).join('')}${admin?`<td><button class="lk" data-del="${i}">Delete</button></td>`:''}</tr>`).join('')||'<tr><td class="mute">No rows.</td></tr>'}</tbody></table></div>
${admin?'<p><button class="btn" data-add="1">Add row</button> <button class="btn" data-save="1">Save to GitHub</button></p>':''}</div>`;msg=''}
$('#v-data').addEventListener('input',e=>{const t=e.target;if(t.dataset.r!==undefined)RAW[dk][+t.dataset.r][+t.dataset.c]=t.value});
$('#v-data').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.dk){dk=d.dk;rData()}
else if(d.del!==undefined){RAW[dk].splice(+d.del,1);rData()}
else if(d.add){const r=Array(TB[dk].size).fill('');if(dk==='pol'){r[0]=String(Math.max(0,...RAW.pol.map(x=>+x[0]||0))+1);r[2]='Not yet added';r[4]='To be added';r[5]='To be added'}if(dk==='rel')r[2]='spouse';if(dk==='news')r[0]=new Date().toISOString().slice(0,10);if(dk==='src')r[1]='1';RAW[dk].push(r);rData()}
else if(d.save){commit(dk).then(er=>{msg=er?'<b>Not saved.</b> '+esc(er):'Saved '+esc(TB[dk].f)+' to GitHub. Reload the page to see it everywhere.';rData()}).catch(er=>{msg='Network error: '+esc(er.message);rData()})}
else if(b.id==='si'){const v=$('#tk').value;if(!v.trim())return;b.disabled=true;signIn(v).then(()=>location.reload()).catch(er=>{tok='';msg='<b>Sign in failed.</b> '+esc(er.message);rData()})}});
$('#adm').onclick=()=>{if(admin)signOut();else show('data')};
/* ---------- home ---------- */
const newsCard=n=>{const d=new Date(n.date+'T00:00:00'),ds=isNaN(d)?n.date:d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}),p=byId.get(+n.pid);
return`<div class="card"><span class="tag">${esc(n.cat)}</span><span class="mute">${esc(ds)}</span><h3>${esc(n.title)}</h3><div>${esc(n.sum)}</div><div style="margin-top:6px">${/^https?:\/\//.test(n.link)?`<a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">Read more</a> `:''}${p?`<button class="lk" data-go="${p.id}">Profile: ${esc(p.name)}</button>`:''}</div></div>`};
function rHome(){const cats=['All',...new Set(NEWS.map(n=>n.cat))],list=NEWS.filter(n=>nf==='All'||n.cat===nf),cnt={},gc={};
P.forEach(p=>{const k=cat(p);cnt[k.lv]=(cnt[k.lv]||0)+1;gc[k.gr]=(gc[k.gr]||0)+1});
const top=Object.keys(gc).sort((a,b)=>gc[b]-gc[a]).slice(0,4),nd=dyn.map((d,i)=>[d,i]).filter(x=>x[0].m.length>1);
$('#v-home').innerHTML=`<div class="hero"><div class="hw"><div><h1>Welcome to Buwaya Tracker</h1><p>Find Philippine politicians, their platforms and track records with sources, and see which families hold power.</p><input id="hq" placeholder="Search politicians, positions, platforms…" autocomplete="off"><div id="hr"></div><div class="hc">${top.map(g=>`<button data-grp="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>
<div class="hcard"><h3>Browse by level</h3><div class="tiles">${LV.filter(l=>cnt[l]).map(l=>`<button data-lv="${l}"><b>${cnt[l]}</b>${l}</button>`).join('')}</div><button class="vall" data-lv="All">View all politicians</button></div></div></div>
<div class="wrap"><div class="cols"><div><h2>Latest news</h2><div class="chips">${cats.map(c=>`<button data-nf="${esc(c)}" class="${c===nf?'on':''}">${esc(c)}</button>`).join('')}</div><div class="news">${list.length?list.map(newsCard).join(''):'<p class="mute">No news yet.</p>'}</div></div>
<div><h2>Dynasty watch</h2>${nd.length?nd.map(([d,i])=>`<div class="card"><b>${esc(d.name)}</b><div class="mute">${d.m.length} members · ${[...new Set(d.m.map(id=>byId.get(id).pos))].map(esc).join(', ')}</div><button class="lk" data-dg="${i}">Open profile</button> · <button class="lk" data-show="tracker">View graph</button></div>`).join(''):'<p class="mute">No family links yet.</p>'}</div></div>
<p class="mute" style="margin-top:28px">Edit the data on GitHub: <a href="${EDIT_URL}politicians.txt" target="_blank" rel="noopener noreferrer">politicians</a> · <a href="${EDIT_URL}relations.txt" target="_blank" rel="noopener noreferrer">relations</a> · <a href="${EDIT_URL}news.txt" target="_blank" rel="noopener noreferrer">news</a></p></div>`;
$('#hq').oninput=e=>{const v=e.target.value.trim().toLowerCase();$('#hr').innerHTML=v?(P.filter(p=>(p.name+' '+p.pos+' '+p.plat).toLowerCase().includes(v)).slice(0,6).map(p=>`<button data-go="${p.id}">${esc(p.name)} <span class="mute">${esc(p.pos)}</span></button>`).join('')||'<div class="mute" style="padding:8px 12px">No matching records found.</div>'):''};
$('#hq').onkeydown=e=>{if(e.key==='Enter'){dq=e.target.value.trim();dl='All';show('dir')}}}
/* ---------- news search ---------- */
$('#v-news').innerHTML=`<div class="wrap"><h1>News search</h1><p class="mute">Most news sites don’t allow embedding, so these buttons open the search in a new tab. To keep a search box on this page, create a free Google Programmable Search Engine and put its ID in <code>CSE_ID</code> at the top of the script.</p><select id="nsp"><option value="">Choose a politician…</option>${P.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><input id="nsq" placeholder="Or type a search"><button class="btn" data-ns="g">Google News</button> <button class="btn" data-ns="b">Bing News</button><div id="cse" style="margin-top:14px"></div></div>`;
$('#nsp').onchange=e=>{$('#nsq').value=e.target.value?'"'+e.target.value+'"':''};
$('#v-news').addEventListener('click',e=>{const b=e.target.closest('[data-ns]');if(!b)return;const v=$('#nsq').value.trim();if(!v)return;window.open((b.dataset.ns==='g'?'https://news.google.com/search?q=':'https://www.bing.com/news/search?q=')+encodeURIComponent(v),'_blank','noopener')});
if(CSE_ID){const sc=document.createElement('script');sc.src='https://cse.google.com/cse.js?cx='+encodeURIComponent(CSE_ID);sc.async=true;document.head.appendChild(sc);$('#cse').innerHTML='<div class="gcse-search"></div>'}
/* ---------- routing and global clicks ---------- */
const VIEWS=['home','dir','tracker','cmp','news','data'];
function show(v){if(!VIEWS.includes(v))v='home';VIEWS.forEach(x=>{$('#v-'+x).hidden=x!==v});document.querySelectorAll('#top button[data-show]').forEach(b=>b.classList.toggle('on',b.dataset.show===v));
if(v==='tracker')fit();if(v==='dir')rDir();if(v==='cmp')rCmp();if(v==='data')rData();if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-show],[data-lv],[data-grp],[data-nf],[data-dg],[data-edit],[data-graph],[data-cmpw]');if(!b)return;const d=b.dataset;
if(d.go)openProf(+d.go);
else if(d.show){closeM();show(d.show)}
else if(d.lv){dl=d.lv;dq='';closeM();show('dir')}
else if(d.grp){dq=d.grp;dl='All';show('dir')}
else if(d.nf!==undefined){nf=d.nf;rHome()}
else if(d.dg)openProf(dyn[+d.dg].m[0]);
else if(d.edit)openEdit(d.edit==='new'?null:+d.edit);
else if(d.graph){closeM();sel=+d.graph;show('tracker');go('dyn')}
else if(d.cmpw){const v=+$('#cw').value;if(v){cA=+d.cmpw;cB=v;closeM();show('cmp')}}});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
rHome();show(location.hash.slice(1));
}
main().catch(e=>{console.error(e);const h=document.getElementById('v-home');h.hidden=false;h.innerHTML='<div class="wrap"><h2>Couldn’t load the data files</h2><p class="mute">'+String(e.message||e).replace(/[<>&]/g,'')+'. Open this site through GitHub Pages or a local server (for example <code>python -m http.server</code>) instead of double-clicking the file. The data files must be in a <code>data</code> folder or the repository root.</p></div>'});
</script>
</body>
</html>
