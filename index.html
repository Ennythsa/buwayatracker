<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buwaya Tracker</title>
<style>
:root{color-scheme:light dark;--bg:#f4f3ef;--panel:#ffffff;--ink:#1f1e1b;--mute:#6b6a64;--line:#dedbd0;--accent:#6d4aff;--edge:#a19e92;--card:#f4f3ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--panel:#1c1c1f;--ink:#ecebe6;--mute:#9a988f;--line:#33322e;--accent:#a58bff;--edge:#6b6a64;--card:#232326}}
:root[data-theme="dark"]{--bg:#141416;--panel:#1c1c1f;--ink:#ecebe6;--mute:#9a988f;--line:#33322e;--accent:#a58bff;--edge:#6b6a64;--card:#232326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;margin:0}header p{margin:0;color:var(--mute);font-size:12px}
#stats{color:var(--mute);font-size:12px;text-align:right}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 370px}
#stage{position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;max-width:calc(100% - 20px)}
#legend div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
#legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#legend svg{vertical-align:middle;margin-right:3px}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
nav{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1;padding:10px 6px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
#pane{padding:14px;overflow:auto;flex:1;min-height:0}
h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.mute{color:var(--mute);font-size:12px}
.tag{display:inline-block;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-right:4px}
button.lk{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-align:left}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
input,select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px}
textarea{resize:vertical;min-height:90px}
ul{margin:6px 0 0;padding-left:0;list-style:none}li{margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
td,th{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top;text-align:left;word-wrap:break-word}
th{width:22%;color:var(--mute);font-weight:500}
.ok{color:#1D9E75;font-size:12px;margin-left:8px}
[hidden]{display:none!important}a{color:var(--accent)}header{flex-wrap:wrap}
#top{display:flex;gap:6px}#top button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mute);padding:6px 12px;font:inherit;cursor:pointer}#top button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#v-home{flex:1;min-height:0;overflow:auto}.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
.hero h2{font-size:26px;margin:0 0 6px}.hero{padding:8px 0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0 24px}.stats .card{margin:0;text-align:center}.stats b{display:block;font-size:24px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}.chips button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 11px;color:var(--mute);font:inherit;cursor:pointer}.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.news{display:grid;gap:10px}.news .card{margin:0}.news h3{margin:6px 0 4px;font-size:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:48% 1fr}aside{border-left:0;border-top:1px solid var(--line)}}

#extra-view{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--ink);overflow:auto;padding:18px;box-sizing:border-box}
.extra-wrap{max-width:1100px;margin:0 auto}.extra-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.extra-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.extra-table-wrap{overflow:auto}.extra-table{min-width:720px}.extra-table th{width:auto;position:sticky;top:0;background:var(--panel)}
.extra-table td,.extra-table th{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
.cite{font-size:.8em;vertical-align:super;margin-left:2px}.cite a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.cite a:hover::after{content:attr(data-tip);position:absolute;z-index:30;max-width:280px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 14px #0002;border-radius:6px;padding:8px;margin:14px 0 0 -90px;font-size:12px;vertical-align:baseline}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-size:12px;color:var(--mute)}
.extra-note{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:10px 0}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button{margin:0}
@media(max-width:760px){#top{flex-wrap:wrap}#extra-view{padding:12px}}
</style>
</head>
<body>
<header><div><h1>Buwaya Tracker</h1><p>Political dynasty graph · all names and links are fictional sample data</p></div><div id="top"><button data-show="home">Home</button><button data-show="tracker">Dynasty Graph</button><button id="open-news">News &amp; Sources</button><button id="open-data">Records Table</button><button id="open-auth" aria-label="Account" title="Account">Sign in</button><button id="open-logout" hidden aria-label="Sign out" title="Sign out">🚪 Sign out</button></div></header>
<section id="v-home"></section>
<main id="v-tracker" hidden>
<section id="stage"><canvas id="cv"></canvas><div id="legend"></div></section>
<aside><nav id="tabs"></nav><div id="pane"></div></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const EDIT_URL='https://github.com/YOUR-USERNAME/YOUR-REPO/edit/main/data/';
// Configure these with your Supabase Project URL and anon/publishable key.
// Never place a service_role/secret key in this public HTML.

const SUPABASE_URL='https://hfkwmqvbopizmzdkboan.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_AIdhguufnXgAcSbq22V-1A_vAhcxfQn';




const supabaseReady=()=>window.supabase&&/^https:\/\/.+/.test(SUPABASE_URL)&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');
const sb=supabaseReady()?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
async function dbRows(table){if(!sb)return null;const {data,error}=await sb.from(table).select('*');if(error)throw error;return data||[]}

const txt=async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Could not load '+f+' ('+r.status+')');return r.text()};
const rows=t=>t.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&l[0]!=='#').map(l=>l.split('|').map(x=>x.trim()));
const sn=n=>{const w=n.split(/\s+/);let i=w.length-1;while(i>0&&/^(de|del|dela|delos|san|santa|van|von)$/i.test(w[i-1]))i--;return w.slice(i).join(' ')};
async function main(){
let P,R,NEWS;
if(sb){
  const [pp,rr,nn]=await Promise.all([dbRows('politicians'),dbRows('relations'),dbRows('news')]);
  P=pp.map(p=>({id:+p.id,name:p.name,party:p.party||'',pos:p.position||'',plat:p.platform||'',rec:p.track_record||'',s:sn(p.name)}));
  const ids=new Set(P.map(p=>p.id));
  R=rr.filter(r=>ids.has(+r.person_a)&&ids.has(+r.person_b)&&['spouse','parent','sibling','cousin'].includes(r.relation_type)).map(r=>[+r.person_a,+r.person_b,r.relation_type]);
  NEWS=nn.map(n=>({date:n.published_at||'',cat:n.category||'General',title:n.title||'',sum:n.summary||'',link:n.url||'',pid:n.politician_id||''})).sort((a,b)=>b.date.localeCompare(a.date));
}else{
  P=rows(await txt('politicians.txt')).filter(c=>c.length>=6&&/^\d+$/.test(c[0])).map(c=>({id:+c[0],name:c[1],party:c[2],pos:c[3],plat:c[4],rec:c.slice(5).join('|'),s:sn(c[1])}));
  const ids=new Set(P.map(p=>p.id));
  R=rows(await txt('relations.txt')).filter(c=>ids.has(+c[0])&&ids.has(+c[1])&&['spouse','parent','sibling','cousin'].includes(c[2])).map(c=>[+c[0],+c[1],c[2]]);
  NEWS=rows(await txt('news.txt')).filter(c=>c.length>=4).map(c=>({date:c[0],cat:c[1],title:c[2],sum:c[3],link:c[4]||'',pid:c[5]||''})).sort((a,b)=>b.date.localeCompare(a.date));
}
const PAL=['#7F77DD','#1D9E75','#D85A30','#BA7517','#378ADD','#D4537E'],COL={};[...new Set(P.map(p=>p.party))].forEach((k,i)=>{COL[k]=PAL[i%PAL.length]});
const STY={parent:{d:[],w:2.4},spouse:{d:[],w:1.4},sibling:{d:[7,4],w:1.4},cousin:{d:[2,4],w:1.6}};
const byId=new Map(P.map(p=>[p.id,p]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const adj=new Map(P.map(p=>[p.id,[]]));
R.forEach(([a,b,t])=>{adj.get(a).push({to:b,t,a,b});adj.get(b).push({to:a,t,a,b})});
const relLabel=(e,from)=>e.t==='parent'?(e.a===from?'Parent of':'Child of'):e.t[0].toUpperCase()+e.t.slice(1)+' of';
/* dynasties = connected family groups */
const comp=new Map(),dyn=[];
P.forEach(p=>{if(comp.has(p.id))return;const q=[p.id],m=[];comp.set(p.id,dyn.length);
while(q.length){const x=q.pop();m.push(x);adj.get(x).forEach(e=>{if(!comp.has(e.to)){comp.set(e.to,dyn.length);q.push(e.to)}})}
m.sort((a,b)=>a-b);dyn.push({m,name:m.length>1?'House of '+byId.get(m[0]).s:'Independent: '+byId.get(m[0]).name})});
function path(a,b){const prev=new Map([[a,null]]),q=[a];
while(q.length){const x=q.shift();if(x===b)break;adj.get(x).forEach(e=>{if(!prev.has(e.to)){prev.set(e.to,{from:x,e});q.push(e.to)}})}
if(!prev.has(b))return null;const out=[];let c=b;while(c!==a){const s=prev.get(c);out.unshift(s);c=s.from}return out}
/* ---------- state ---------- */
let tab='dyn',sel=null,hover=null,hl=null,q='',cA=P[0]?.id,cB=P[Math.min(4,P.length-1)]?.id;
const $=s=>document.querySelector(s),pane=$('#pane');
/* ---------- graph ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
let W=300,H=300,dpr=1,view={x:0,y:0,k:1,set:0},alpha=1;
const N=P.map((p,i)=>{const a=i/P.length*6.283;return{id:p.id,x:Math.cos(a)*160,y:Math.sin(a)*160,vx:0,vy:0,r:9+adj.get(p.id).length*3,fx:false}});
const nm=new Map(N.map(n=>[n.id,n]));
function fit(){const r=stage.getBoundingClientRect();dpr=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;if(!view.set&&W>10){view.x=W/2;view.y=H/2;view.set=1}}
new ResizeObserver(fit).observe(stage);fit();
function step(){const a=alpha;
for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const A=N[i],B=N[j];let dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=3200/d2*a;dx/=d;dy/=d;A.vx-=dx*f;A.vy-=dy*f;B.vx+=dx*f;B.vy+=dy*f}
R.forEach(([x,y])=>{const A=nm.get(x),B=nm.get(y);let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,f=(d-105)*.05*a;dx/=d;dy/=d;A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f});
N.forEach(n=>{n.vx-=n.x*.01*a;n.vy-=n.y*.01*a;if(!n.fx){n.x+=n.vx;n.y+=n.vy}n.vx*=.8;n.vy*=.8});alpha*=.985}
function focusSet(){if(hl)return hl;const id=hover??sel;if(id==null)return null;const s=new Set([id]);adj.get(id).forEach(e=>s.add(e.to));return s}
function matchSet(){if(!q)return null;const k=q.toLowerCase();return new Set(P.filter(p=>p.name.toLowerCase().includes(k)||p.plat.toLowerCase().includes(k)).map(p=>p.id))}
function draw(){const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=g('--bg');ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
const F=focusSet(),M=matchSet(),fid=hover??sel;
dyn.forEach(d=>{if(d.m.length<2)return;let cx=0,cy=0;d.m.forEach(i=>{cx+=nm.get(i).x;cy+=nm.get(i).y});cx/=d.m.length;cy/=d.m.length;
let r=0;d.m.forEach(i=>{r=Math.max(r,Math.hypot(nm.get(i).x-cx,nm.get(i).y-cy))});r+=48;
ctx.globalAlpha=1;ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.fillStyle=g('--accent');ctx.globalAlpha=.06;ctx.fill();
ctx.globalAlpha=.35;ctx.setLineDash([4,5]);ctx.lineWidth=1;ctx.strokeStyle=g('--accent');ctx.stroke();ctx.setLineDash([]);
ctx.globalAlpha=.8;ctx.fillStyle=g('--mute');ctx.font='600 12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(d.name,cx,cy-r+16)});
R.forEach(([a,b,t])=>{const A=nm.get(a),B=nm.get(b),on=F&&fid!=null&&(a===fid||b===fid||(hl&&hl.has(a)&&hl.has(b)));
const dim=(F&&!on)||(M&&!(M.has(a)&&M.has(b)));ctx.globalAlpha=dim?.12:1;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
ctx.setLineDash(STY[t].d);ctx.lineWidth=STY[t].w;ctx.strokeStyle=on?g('--accent'):g('--edge');ctx.stroke();ctx.setLineDash([])});
N.forEach(n=>{const p=byId.get(n.id),dim=(F&&!F.has(n.id))||(M&&!M.has(n.id));ctx.globalAlpha=dim?.18:1;
ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.283);ctx.fillStyle=COL[p.party]||'#888';ctx.fill();
if(n.id===sel||n.id===cA&&tab==='cmp'||n.id===cB&&tab==='cmp'){ctx.lineWidth=3;ctx.strokeStyle=g('--accent');ctx.beginPath();ctx.arc(n.x,n.y,n.r+4,0,6.283);ctx.stroke()}
ctx.fillStyle=g('--ink');ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(p.name,n.x,n.y+n.r+15);
ctx.fillStyle=g('--mute');ctx.font='11px system-ui,sans-serif';ctx.fillText(p.pos,n.x,n.y+n.r+28)});
ctx.restore();ctx.globalAlpha=1}
(function loop(){if(alpha>.01)step();draw();requestAnimationFrame(loop)})();
/* ---------- pointer interaction ---------- */
const toW=(x,y)=>[(x-view.x)/view.k,(y-view.y)/view.k];
function hit(x,y){const [wx,wy]=toW(x,y);for(let i=N.length-1;i>=0;i--){const n=N[i];if(Math.hypot(n.x-wx,n.y-wy)<n.r+5)return n}return null}
let drag=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,n=hit(x,y);cv.setPointerCapture(e.pointerId);
drag={n,x,y,vx:view.x,vy:view.y,moved:false};if(n){n.fx=true;alpha=Math.max(alpha,.3)}});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
if(drag){if(Math.hypot(x-drag.x,y-drag.y)>3)drag.moved=true;
if(drag.n&&drag.moved){const [wx,wy]=toW(x,y);drag.n.x=wx;drag.n.y=wy;alpha=Math.max(alpha,.3)}
else if(!drag.n&&drag.moved){view.x=drag.vx+x-drag.x;view.y=drag.vy+y-drag.y}}
else{const n=hit(x,y);hover=n?n.id:null;cv.style.cursor=n?'pointer':'grab'}});
cv.addEventListener('pointerup',()=>{if(!drag)return;if(drag.n)drag.n.fx=false;
if(!drag.moved){if(drag.n)select(drag.n.id);else{sel=null;if(tab==='prof')go('dyn')}}drag=null});
cv.addEventListener('pointerleave',()=>{if(!drag)hover=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,k=Math.min(2.5,Math.max(.4,view.k*(e.deltaY<0?1.1:.9))),f=k/view.k;
view.x=x-(x-view.x)*f;view.y=y-(y-view.y)*f;view.k=k},{passive:false});
/* ---------- panel ---------- */
const TABS=[['dyn','Dynasties'],['search','Search'],['cmp','Compare'],['prof','Profile'],['exp','Export']];
$('#tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)});
pane.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)select(+b.dataset.go)});
function select(id){sel=id;show('tracker');go('prof')}
function go(t){tab=t;hl=null;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
({dyn:rDyn,search:rSearch,cmp:rCmp,prof:rProf,exp:rExp})[t]()}
const chip=id=>`<button class="lk" data-go="${id}">${esc(byId.get(id).name)}</button>`;
function rDyn(){pane.innerHTML='<h2>Political dynasties</h2><p class="mute">Each dashed circle on the graph is a family group. Hover a card to highlight it, click a name for the profile.</p>'+
dyn.map((d,i)=>{const pos=d.m.map(id=>byId.get(id).pos);return`<div class="card" data-d="${i}"><b>${esc(d.name)}</b><div class="mute">${d.m.length} member${d.m.length>1?'s':''} · holds ${pos.map(esc).join(', ')}</div><ul>${d.m.map(id=>`<li>${chip(id)} <span class="mute">${esc(byId.get(id).party)}</span></li>`).join('')}</ul></div>`}).join('');
pane.querySelectorAll('[data-d]').forEach(c=>{c.onmouseenter=()=>{hl=new Set(dyn[+c.dataset.d].m)};c.onmouseleave=()=>{hl=null}})}
function rSearch(){pane.innerHTML=`<h2>Search &amp; filter</h2><input id="qi" placeholder="Name or platform keyword" value="${esc(q)}"><div id="res"></div>`;
const run=()=>{const m=P.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase())||p.plat.toLowerCase().includes(q.toLowerCase()));
$('#res').innerHTML=m.length?m.map(p=>`<div class="card"><b>${chip(p.id)}</b><div class="mute">ID ${p.id} · ${esc(p.party)} · ${esc(p.pos)}</div><div>${esc(p.plat)}</div></div>`).join(''):'<p class="mute">No matching records found.</p>'};
$('#qi').oninput=e=>{q=e.target.value.trim();run()};run()}
function rCmp(){const opts=v=>P.map(p=>`<option value="${p.id}"${p.id===v?' selected':''}>${esc(p.name)}</option>`).join('');
pane.innerHTML=`<h2>Compare two politicians</h2><select id="ca">${opts(cA)}</select><select id="cb">${opts(cB)}</select><div id="out"></div>`;
const run=()=>{const A=byId.get(cA),B=byId.get(cB);if(cA===cB){$('#out').innerHTML='<p class="mute">Pick two different politicians.</p>';return}
const pth=path(cA,cB);let rel;
if(!pth)rel='No family link found. These two are in different dynasties.';
else{rel='<ul>'+pth.map(s=>`<li>${chip(s.from)} <span class="tag">${relLabel(s.e,s.from)}</span> ${chip(s.e.to)}</li>`).join('')+'</ul>'}
const row=(l,a,b)=>`<tr><th>${l}</th><td>${esc(a)}</td><td>${esc(b)}</td></tr>`;

function rHome(){const cats=['All',...new Set(NEWS.map(n=>n.cat))],list=NEWS.filter(n=>nf==='All'||n.cat===nf),nd=dyn.map((d,i)=>[d,i]).filter(x=>x[0].m.length>1);

main().catch(e=>{console.error(e);const h=document.getElementById('v-home');h.hidden=false;h.innerHTML='<div class="wrap"><h2>Couldn’t load the data files</h2><p class="mute">'+String(e.message||e).replace(/[<>&]/g,'')+'. Open this site through GitHub Pages or a local server (for example <code>python -m http.server</code>) instead of double-clicking the file.</p></div>'});

<script>
(function(){
 const $=s=>document.querySelector(s), view=$('#extra-view'), content=$('#extra-content');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const getUser=()=>{try{return JSON.parse(localStorage.getItem('bt_demo_user')||'null')}catch{return null}};
 let liveRole='visitor';
 const isAdmin=()=>liveRole==='admin';
 async function refreshRole(){liveRole='visitor';let user=null;if(sb){const result=await sb.auth.getUser();user=result?.data?.user||null;if(user){const {data}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();liveRole=data?.role==='admin'?'admin':'visitor';localStorage.setItem('bt_demo_user',JSON.stringify({email:user.email||'',role:liveRole}))}}else{user=getUser();liveRole=user?.role==='admin'?'admin':'visitor'};updateAccountButtons(!!user);return user}
 function updateAccountButtons(signedIn){const b=$('#open-auth'),out=$('#open-logout');if(!b||!out)return;b.textContent=signedIn?'👤 Account':'Sign in';b.title=signedIn?'Manage account details':'Sign in';b.setAttribute('aria-label',signedIn?'Manage account details':'Sign in');out.hidden=!signedIn;}
 async function signOut(){if(sb){const {error}=await sb.auth.signOut();if(error){alert(error.message);return}}localStorage.removeItem('bt_demo_user');liveRole='visitor';updateAccountButtons(false);close();}
 const demoPeople=[
  {id:'sample-1',name:'Sample Politician A',party:'Example Party',position:'Public official',platform:'Public service and transparency',record:'DEMO ENTRY: Replace with verified, dated claims before publishing.',status:'Needs verification',sources:[{label:'Official government portal',url:'https://www.gov.ph/'},{label:'Official gazette',url:'https://www.officialgazette.gov.ph/'}]},
  {id:'sample-2',name:'Sample Politician B',party:'Example Party',position:'Legislator',platform:'Legislation and public accountability',record:'DEMO ENTRY: Add a sourced record; do not treat this placeholder as a factual claim.',status:'Needs verification',sources:[{label:'House of Representatives',url:'https://www.congress.gov.ph/'},{label:'Senate of the Philippines',url:'https://senate.gov.ph/'}]},
  {id:'sample-3',name:'Sample Politician C',party:'Independent',position:'Local official',platform:'Local governance and public services',record:'DEMO ENTRY: Add documented actions, dates, outcomes, and case status where relevant.',status:'Needs verification',sources:[{label:'Commission on Audit',url:'https://www.coa.gov.ph/'},{label:'Commission on Elections',url:'https://comelec.gov.ph/'}]}
 ];
 const loadPeople=async()=>{if(sb){const [ps,ss]=await Promise.all([dbRows('politicians'),dbRows('sources')]);return ps.map(p=>({...p,id:String(p.id),position:p.position||'',record:p.track_record||'',sources:ss.filter(s=>String(s.politician_id)===String(p.id)).map(s=>({label:s.label,url:s.url}))}))}try{const x=JSON.parse(localStorage.getItem('bt_demo_people')||'null');return Array.isArray(x)?x:demoPeople.map(p=>({...p,sources:p.sources.map(s=>({...s}))}))}catch{return demoPeople}};
 const savePeople=p=>localStorage.setItem('bt_demo_people',JSON.stringify(p));
 const currentUser=()=>sb?.auth?.getUser();
 function open(title,sub,html){$('#extra-title').textContent=title;$('#extra-subtitle').textContent=sub;content.innerHTML=html;view.hidden=false}
 function close(){view.hidden=true}
 $('#extra-close').onclick=close;

 $('#open-auth').onclick=()=>auth();
 $('#open-logout').onclick=()=>signOut();
 function news(){
  open('News search & source desk','Search the web for coverage, then record the original source and date. Search results are external and are not endorsements.',`
  <div class="card"><h2>Search news</h2><form id="news-form"><input id="news-q" placeholder="e.g. politician name, bill number, audit report" required><select id="news-source"><option value="https://news.google.com/search?q=">Google News</option><option value="https://www.google.com/search?q=">Google Search</option><option value="https://www.youtube.com/results?search_query=">YouTube reporting</option></select><button class="btn">Search in new tab</button></form>
  <p class="mute">A true embedded search/results feed usually needs a provider API or backend. Many search engines block iframe embedding, so this opens the selected search provider safely instead.</p></div>
  <div class="extra-grid"><div class="card"><h2>Source checklist</h2><ul><li>Prefer official documents for laws, votes, budgets, and case status.</li><li>Use multiple reputable news reports for disputed events.</li><li>Separate allegations from findings, convictions, acquittals, and appeals.</li><li>Record publication date, author, original URL, and the exact claim supported.</li></ul></div>
  <div class="card"><h2>Example source portals</h2><ul><li><a target="_blank" rel="noopener noreferrer" href="https://www.gov.ph/">Philippine government portal</a></li><li><a target="_blank" rel="noopener noreferrer" href="https://www.officialgazette.gov.ph/">Official Gazette</a></li><li><a target="_blank" rel="noopener noreferrer" href="https://www.coa.gov.ph/">Commission on Audit</a></li><li><a target="_blank" rel="noopener noreferrer" href="https://comelec.gov.ph/">Commission on Elections</a></li></ul></div></div>`);
  $('#news-form').onsubmit=e=>{e.preventDefault();const q=$('#news-q').value.trim(),base=$('#news-source').value;if(q)window.open(base+encodeURIComponent(q),'_blank','noopener,noreferrer')};
 }
 async function table(){
  // Refresh the authenticated session and server-managed role before deciding whether editing is available.
  await refreshRole();
  const people=await loadPeople();
  open('Politician records','Searchable, readable records. Editing is available only to accounts with the administrator role.',`
  <div class="extra-note"><b>Data mode:</b> ${sb?(isAdmin()?'Supabase administrator mode':'Read-only visitor mode'):(isAdmin()?'Local demo admin mode':'Read-only visitor mode')}. ${isAdmin()?(sb?'Changes save to Supabase and are enforced by database policies.':'Demo changes save only in this browser.'):'Sign in with an administrator account to enable record editing.'}</div>
  <input id="people-filter" placeholder="Filter by name, party, position, record…">
  <div class="extra-table-wrap"><table class="extra-table"><thead><tr><th>Name</th><th>Party / position</th><th>Platform</th><th>Track record</th><th>Sources</th><th>Actions</th></tr></thead><tbody id="people-body"></tbody></table></div>
  ${isAdmin()?'<div class="card"><h2>Add / edit record</h2><form id="person-form"><input type="hidden" id="p-id"><input id="p-name" placeholder="Full name" required><input id="p-party" placeholder="Party"><input id="p-position" placeholder="Position"><textarea id="p-platform" placeholder="Platform"></textarea><textarea id="p-record" placeholder="Track record — distinguish verified facts from allegations"></textarea><input id="p-status" placeholder="Status / verification note"><textarea id="p-sources" placeholder="One source per line: Label | https://example.com/source" required></textarea><button class="btn">Save record</button> <button type="button" id="p-new">Clear form</button></form><button class="btn" id="export-json">Export local records as JSON</button> <button class="btn" id="export-txt">Export politicians.txt format</button><span id="export-msg" class="ok"></span></div>':''}`);
  const body=$('#people-body');
  async function render(){const q=($('#people-filter').value||'').toLowerCase();const allPeople=await loadPeople();const filtered=allPeople.filter(p=>[p.name,p.party,p.position,p.platform,p.record].join(' ').toLowerCase().includes(q));
   body.innerHTML=filtered.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="pill">${esc(p.status||'Unreviewed')}</span></td><td>${esc(p.party)}<br>${esc(p.position)}</td><td>${esc(p.platform)}</td><td>${esc(p.record)}</td><td>${(p.sources||[]).map((s,i)=>`<div><sup class="cite"><a href="${/^https?:\/\//i.test(s.url)?esc(s.url):'#'}" target="_blank" rel="noopener noreferrer" data-tip="${esc(s.label)}">${i+1}</a></sup> <a href="${/^https?:\/\//i.test(s.url)?esc(s.url):'#'}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a></div>`).join('')}</td><td>${isAdmin()?`<button class="btn" data-edit="${esc(p.id)}">Edit</button> <button data-delete="${esc(p.id)}">Delete</button>`:'<span class="mute">Read only</span>'}</td></tr>`).join('')||'<tr><td colspan="6">No matching records.</td></tr>';
  }
  $('#people-filter').oninput=()=>render();render();
  if(isAdmin()){
   const clear=()=>{$('#person-form').reset();$('#p-id').value=''};
   $('#p-new').onclick=clear;
   body.onclick=async e=>{const eb=e.target.closest('[data-edit]'),db=e.target.closest('[data-delete]');let ps=await loadPeople();if(db&&confirm('Delete this record?')){if(sb){const {error}=await sb.from('politicians').delete().eq('id',db.dataset.delete);if(error){alert(error.message);return}}else savePeople(ps.filter(p=>p.id!==db.dataset.delete));await render()}if(eb){const p=ps.find(x=>String(x.id)===eb.dataset.edit);if(!p)return;$('#p-id').value=p.id;$('#p-name').value=p.name;$('#p-party').value=p.party;$('#p-position').value=p.position;$('#p-platform').value=p.platform;$('#p-record').value=p.record;$('#p-status').value=p.status||'';$('#p-sources').value=(p.sources||[]).map(s=>s.label+' | '+s.url).join('\n');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}};
   $('#person-form').onsubmit=async e=>{e.preventDefault();const ps=await loadPeople(),rawId=$('#p-id').value,sources=$('#p-sources').value.split(/\r?\n/).map(l=>{const i=l.indexOf('|');return i<0?null:{label:l.slice(0,i).trim(),url:l.slice(i+1).trim()}}).filter(s=>s&&s.label&&/^https?:\/\//i.test(s.url));const p={name:$('#p-name').value.trim(),party:$('#p-party').value.trim(),position:$('#p-position').value.trim(),platform:$('#p-platform').value.trim(),track_record:$('#p-record').value.trim(),status:$('#p-status').value.trim()};if(sb){let saved;if(rawId){const {data,error}=await sb.from('politicians').update(p).eq('id',rawId).select('id').single();if(error){$('#export-msg').textContent=error.message;return}saved=data}else{const {data,error}=await sb.from('politicians').insert(p).select('id').single();if(error){$('#export-msg').textContent=error.message;return}saved=data}const {error:delErr}=await sb.from('sources').delete().eq('politician_id',saved.id);if(delErr){$('#export-msg').textContent=delErr.message;return}if(sources.length){const {error:insErr}=await sb.from('sources').insert(sources.map(s=>({...s,politician_id:saved.id})));if(insErr){$('#export-msg').textContent=insErr.message;return}}}else{const id=rawId||('local-'+Date.now()),localP={id,...p,record:p.track_record,sources};const i=ps.findIndex(x=>String(x.id)===id);if(i>=0)ps[i]=localP;else ps.push(localP);savePeople(ps)}await render();clear();$('#export-msg').textContent=sb?'Saved to database.':'Saved in this browser only.'};
   $('#export-json').onclick=async()=>download('politicians.json',JSON.stringify(await loadPeople(),null,2),'application/json');
   $('#export-txt').onclick=async()=>{const lines=(await loadPeople()).map((p,i)=>[i+1,p.name,p.party,p.position,p.platform,p.record].map(x=>String(x||'').replace(/[|\r\n]/g,' ')).join('|')).join('\n');download('politicians.txt',lines,'text/plain;charset=utf-8')};
  }
 }
 function download(name,data,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
 async function auth(){
  const liveUser=await refreshRole(); const u=liveUser?{email:liveUser.email||'',role:liveRole}:getUser();
  open(u?'Account details':'Sign in / sign up',u?'Manage your signed-in account and access.':(sb?'Sign in or create an account to access your account.':'Connect Supabase to enable real sign-in and account creation.'),u?`<div class="extra-grid"><div class="card"><h2>👤 Account details</h2><p>Email: <b>${esc(u.email||'Not available')}</b></p><p>Access role: <b>${esc(u.role||'visitor')}</b></p><p class="mute">${u.role==='admin'?'Administrator access is managed securely in Supabase.':'Your account currently has visitor access.'}</p></div><div class="card"><h2>Update account</h2><form id="account-email-form"><label for="account-email">Change email</label><input id="account-email" type="email" placeholder="New email address" required><button class="btn">Update email</button></form><form id="account-password-form"><label for="account-password">Change password</label><input id="account-password" type="password" minlength="8" placeholder="New password (8+ characters)" required><button class="btn">Update password</button></form><p id="account-msg" role="status"></p></div></div>${u.role==='admin'?'<div class="card"><h2>Admin tools</h2><p>Open the records table to add, edit, or delete politician records.</p><button class="btn" id="account-open-records">Open records table</button></div>':''}<div class="extra-note">For security, administrator permissions come from the Supabase profile role; they cannot be granted from this page.</div>`:`
  <div class="extra-grid"><div class="card"><h2>Sign in</h2><form id="signin"><input id="in-email" type="email" placeholder="Email" required><input id="in-pass" type="password" placeholder="Password" required><button class="btn">Sign in</button></form></div>
  <div class="card"><h2>Create account</h2><form id="signup"><input id="up-email" type="email" placeholder="Email" required><input id="up-pass" type="password" minlength="8" placeholder="Password (8+ characters)" required><button class="btn">Create account</button></form><p class="mute">New accounts start with visitor access. Supabase handles authentication when configured.</p></div></div>
  <div class="extra-note"><b>Admin access:</b> administrator permissions are assigned in Supabase, never through a browser form. ${sb?"Supabase is configured.":"Add your Supabase project URL and public anon/publishable key to enable authentication."}</div><p id="auth-msg" role="status"></p>`);
  if(u){
   $('#account-email-form').onsubmit=async e=>{e.preventDefault();const msg=$('#account-msg');if(!sb){msg.textContent='Connect Supabase to update account details securely.';return}const {error}=await sb.auth.updateUser({email:$('#account-email').value.trim()});msg.textContent=error?error.message:'Email update requested. Check your inbox for any confirmation link.'};
   $('#account-password-form').onsubmit=async e=>{e.preventDefault();const msg=$('#account-msg');if(!sb){msg.textContent='Connect Supabase to update account details securely.';return}const {error}=await sb.auth.updateUser({password:$('#account-password').value});msg.textContent=error?error.message:'Password updated successfully.';if(!error)e.target.reset()};
   const recordsBtn=$('#account-open-records');if(recordsBtn)recordsBtn.onclick=()=>table();return
  }
  $('#signin').onsubmit=async e=>{e.preventDefault();if(!sb){$('#auth-msg').textContent='Add your Supabase project URL and anon key to enable real sign-in.';return}const {error}=await sb.auth.signInWithPassword({email:$('#in-email').value.trim(),password:$('#in-pass').value});if(error){$('#auth-msg').textContent=error.message;return}await auth();};
  $('#signup').onsubmit=async e=>{e.preventDefault();if(!sb){$('#auth-msg').textContent='Add your Supabase project URL and anon key to enable real sign-up.';return}const {error}=await sb.auth.signUp({email:$('#up-email').value.trim(),password:$('#up-pass').value});if(error){$('#auth-msg').textContent=error.message;return}$('#auth-msg').textContent='Account created. Check your email if confirmation is enabled, then sign in.'};
 }
 // Restore the visible account/sign-out controls when a saved session exists.
 refreshRole().catch(()=>updateAccountButtons(false));
})();
