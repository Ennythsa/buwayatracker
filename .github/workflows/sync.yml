name: Sync data from Supabase
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/export.mjs
      - run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add politicians.txt relations.txt news.txt
          git diff --staged --quiet || (git commit -m "Sync from Supabase" && git push)
